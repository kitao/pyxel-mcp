[project]
name = "pyxel-mcp"
version = "1.3.1"
description = "MCP server for Pyxel, a retro game engine for Python. Provides headless tools to observe Pyxel programs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Takashi Kitao", email = "takashi.kitao@gmail.com" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "pyxel",
    "retro-game",
    "game-engine",
    "game-testing",
    "headless",
    "pixel-art",
    "ai-agent",
    "claude",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=2.0.0,<3.0.0", "pyxel>=2.9.6", "numpy", "Pillow"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.urls]
Homepage = "https://github.com/kitao/pyxel-mcp"
Repository = "https://github.com/kitao/pyxel-mcp"
Changelog = "https://github.com/kitao/pyxel-mcp/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/kitao/pyxel-mcp/issues"
"MCP Registry" = "https://registry.modelcontextprotocol.io/v0.1/servers?search=pyxel-mcp"
Pyxel = "https://github.com/kitao/pyxel"
"Agent Skill" = "https://github.com/kitao/pyxel-skill"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyxel_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [".github/", "docs/", ".mcp.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
extend-exclude = ["tests/fixtures/scripts"]

[tool.ruff.lint]
extend-select = ["I"]
# Harness code converts every exception into a structured error record, so
# catching Exception broadly is the contract rather than a smell.
ignore = ["BLE001"]

[project.scripts]
pyxel-mcp = "pyxel_mcp.cli:main"
