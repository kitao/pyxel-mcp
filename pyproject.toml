[project]
name = "pyxel-mcp"
version = "1.0.0"
description = "MCP server for Pyxel, a retro game engine for Python. Enables AI to autonomously run, verify, and iterate on retro game programs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Takashi Kitao", email = "takashi.kitao@gmail.com" }]
keywords = [
    "mcp",
    "pyxel",
    "retro-game",
    "game-engine",
    "pixel-art",
    "ai",
    "claude",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=1.0.0,<2.0.0", "pyxel>=2.9.6", "numpy", "Pillow"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://github.com/kitao/pyxel-mcp"
Repository = "https://github.com/kitao/pyxel-mcp"
"Bug Tracker" = "https://github.com/kitao/pyxel-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyxel_mcp"]

# `_content/` is gitignored (it is a build artefact regenerated by the
# custom hook below). Wheel packaging respects .gitignore by default, so
# without this force-include the workflow content would be silently
# excluded — and the installed server would start in degraded mode with
# no `pyxel://workflow/*` resources. force-include overrides the gitignore
# filter for this one path. The hook still has to run first to produce
# the directory; force-include just stops it from being filtered out.
[tool.hatch.build.targets.wheel.force-include]
"src/pyxel_mcp/workflow/_content" = "pyxel_mcp/workflow/_content"

[tool.hatch.build.hooks.custom]
path = "build_hooks.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: tests that require Pyxel (GUI library)"]

[project.scripts]
pyxel-mcp = "pyxel_mcp.cli:main"
