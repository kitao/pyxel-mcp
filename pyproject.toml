[project]
name = "pyxel-mcp"
version = "1.2.0"
description = "MCP server for Pyxel, a retro game engine for Python. Provides headless tools to observe Pyxel programs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Takashi Kitao", email = "takashi.kitao@gmail.com" }]
keywords = [
    "mcp",
    "pyxel",
    "retro-game",
    "game-engine",
    "pixel-art",
    "ai",
    "claude",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=1.27.0,<2.0.0", "pyxel>=2.9.6", "numpy", "Pillow"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://github.com/kitao/pyxel-mcp"
Repository = "https://github.com/kitao/pyxel-mcp"
"Bug Tracker" = "https://github.com/kitao/pyxel-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyxel_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: tests that require Pyxel (GUI library)"]

[project.scripts]
pyxel-mcp = "pyxel_mcp.cli:main"
