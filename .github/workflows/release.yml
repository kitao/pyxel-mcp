name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version="$(uv version --short)"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"; exit 1; }
          python3 -c "import json; d=json.load(open('server.json')); assert d['version']=='${version}' and d['packages'][0]['version']=='${version}', d"
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Runs once the repository variable PYPI_TRUSTED_PUBLISHING is "true", which
  # means a PyPI trusted publisher exists for this workflow. Until then the
  # package is uploaded by hand and the registry step below still runs.
  pypi:
    needs: build
    if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  mcp-registry:
    needs: [build, pypi]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.pypi.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish to the MCP Registry with GitHub OIDC
        # Keep both short-lived tokens in this process. The publisher CLI's
        # separate login and publish commands share a credential file.
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';

          const registry = 'https://registry.modelcontextprotocol.io';
          const metadata = readFileSync('server.json', 'utf8');
          const request = async (step, url, options) => {
            const response = await fetch(url, { ...options, redirect: 'error' });
            if (!response.ok) throw new Error(`${step} returned HTTP ${response.status}`);
            return response;
          };

          try {
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience', registry);
            const identity = await request('GitHub OIDC', url, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            });
            const { value } = await identity.json();
            if (!value) throw new Error('GitHub OIDC returned no token');

            const exchange = await request('Registry OIDC exchange', registry + '/v0.1/auth/github-oidc', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ oidc_token: value }),
            });
            const { registry_token } = await exchange.json();
            if (!registry_token) throw new Error('Registry OIDC exchange returned no token');

            await request('Registry publish', registry + '/v0.1/publish', {
              method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${registry_token}` },
              body: metadata,
            });
          } catch (error) {
            // HTTP response bodies and transport errors can contain credentials.
            const safe = /^(GitHub OIDC|Registry OIDC exchange|Registry publish) (returned HTTP \d{3}|returned no token)$/;
            console.error(safe.test(error.message) ? error.message : 'Registry publication request failed');
            process.exitCode = 1;
          }
          JS
